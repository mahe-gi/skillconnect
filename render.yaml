services:
  - type: web
    name: skillconnect
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///skillconnect_demo.db
      - key: PAYMENT_MODE
        value: sandbox
      - key: JITSI_DOMAIN
        value: meet.jit.si
      # Optional — leave blank to skip real emails (demo just logs them)
      - key: RESEND_API_KEY
        value: ""
      - key: RESEND_FROM_EMAIL
        value: ""
      # Optional — leave blank to use demo mock payments
      - key: RAZORPAY_KEY_ID
        value: ""
      - key: RAZORPAY_KEY_SECRET
        value: ""
      - key: RAZORPAY_WEBHOOK_SECRET
        value: ""
